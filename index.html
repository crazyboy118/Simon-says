<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIMON SAYS GAME</title>
  <link rel="icon" type="image/png" href="images/photo.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <img src="images/photo.png" alt="Simon Says Logo" class="photo">
  
  <h3>Highest Score: <span id="highScore">0</span> 
  <button id="resetBtn">Reset</button></h3>
  
  <h2>press any key to start the game</h2>

  <div class="btn-container">
    <div class="btn" id="btn1">1</div>
    <div class="btn" id="btn2">2</div>
    <div class="btn" id="btn3">3</div>
    <div class="btn" id="btn4">4</div>
    <div class="btn" id="btn5">5</div>
    <div class="btn" id="btn6">6</div>
  </div>

<script src="app.js"></script>
</body>
</html>
